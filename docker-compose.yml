services:
  postgres:
    image: postgres:16-alpine
    container_name: driverent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: driverent
      POSTGRES_PASSWORD: driverent
      POSTGRES_DB: driverent
    ports:
      - "5432:5432"
    volumes:
      - driverent-data:/var/lib/postgresql/data

volumes:
  driverent-data:
